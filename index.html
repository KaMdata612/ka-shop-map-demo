<style>
:root{--bg:#0f141c;--panel:#151c26;--panel2:#1b2431;--line:#25313f;--txt:#e6edf5;--muted:#8fa3b8;--accent:#3b82f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
     font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;padding:20px 22px 34px}
h1{font-size:19px;margin:0 0 4px}
.lede{color:var(--muted);font-size:13px;margin:0 0 14px}
.ctrl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin:0 0 11px}
.ctrl .lbl{font-size:12px;color:var(--muted);margin:0 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;background:var(--panel2);border:1px solid var(--line);
      color:#c3d3e6;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;user-select:none}
.chip:hover{border-color:#3c5170}
.chip.on{background:#243349;border-color:#3b82f6;color:#fff}
#map{height:620px;border-radius:10px;border:1px solid var(--line);background:#0d141f}
.legend{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend .grad{width:160px;height:10px;border-radius:5px;
  background:linear-gradient(90deg,#6a7280, hsl(212,85%,72%), hsl(212,85%,32%))}
.leaflet-tooltip{background:#0d141f;border:1px solid #2f4460;color:#e6edf5;border-radius:8px;
  box-shadow:0 8px 30px rgba(0,0,0,.5);padding:8px 10px}
.leaflet-tooltip table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
.leaflet-tooltip th,.leaflet-tooltip td{text-align:left;padding:2px 6px;border-bottom:1px solid #1d2836;white-space:nowrap}
.leaflet-tooltip th{color:#8fa3b8;font-weight:500;font-size:11px}
.leaflet-tooltip .sub{color:#8fa3b8;font-size:12px}
</style>
</head>

const MAXD = 11;
const map = L.map('map', {zoomControl:true, attributionControl:false});
L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}',
  {subdomains:['1','2','3','4'], maxZoom:18, minZoom:3}).addTo(map);

let city = "";
let selTcg = new Set();
const layer = L.layerGroup().addTo(map);

function color(d){
  if(d<=0) return "#6a7280";
  const L = 72 - (d/MAXD)*40;
  return `hsl(212,85%,${L}%)`;
}
function tooltipHtml(s){
  const ms = s.matches.slice().sort((a,b)=> a.tcg.localeCompare(b.tcg) || b.date.localeCompare(a.date));
  if(!ms.length) return `<b>${s.name}</b><div class="sub">${s.city} · 近30天未发积分</div>`;
  const rows = `<tr><th>TCG</th><th>日期</th><th>比赛</th><th>参与</th><th>绑定</th></tr>` +
    ms.map(m=>`<tr><td>${m.tcg}</td><td>${m.date}</td><td>${m.name}</td><td>${m.players}</td><td>${m.bound}</td></tr>`).join("");
  return `<b>${s.name}</b><div class="sub">${s.city} · 近30天发了积分 ${s.density} 场</div><table>${rows}</table>`;
}
function render(){
  layer.clearLayers();
  const list = SHOPS.filter(s => !city || s.city===city)
                    .filter(s => selTcg.size===0 || s.tcgs.some(t=>selTcg.has(t)));
  const pts = [];
  list.forEach(s=>{
    pts.push([s.lat, s.lng]);
    const c = L.circleMarker([s.lat, s.lng], {
      radius: s.density>0 ? 6+Math.min(5, s.density*0.5) : 5,
      color:'#000', weight:0.6, opacity:0.55, fillColor: color(s.density), fillOpacity:1
    });
    c.bindTooltip(tooltipHtml(s), {direction:'top', opacity:1});
    layer.addLayer(c);
  });
  if(pts.length){
    const b = L.latLngBounds(pts);
    if(city){ map.fitBounds(b, {padding:[36,36], maxZoom:13}); }
    else { map.fitBounds(b, {padding:[40,40]}); }
  }
}
document.getElementById("cityChips").addEventListener("click", e=>{
  const el = e.target.closest(".chip"); if(!el) return;
  document.querySelectorAll("#cityChips .chip").forEach(c=>c.classList.remove("on"));
  el.classList.add("on"); city = el.dataset.city; render();
});
document.getElementById("tcgChips").addEventListener("click", e=>{
  const el = e.target.closest(".chip"); if(!el) return;
  const t = el.dataset.tcg;
  if(t===""){ selTcg.clear(); document.querySelectorAll("#tcgChips .chip").forEach(c=>c.classList.remove("on"));
    el.classList.add("on"); }
  else {
    document.querySelector("#tcgChips .chip[data-tcg='']").classList.remove("on");
    if(selTcg.has(t)){ selTcg.delete(t); el.classList.remove("on"); }
    else { selTcg.add(t); el.classList.add("on"); }
  }
  render();
});
render();
</script>
